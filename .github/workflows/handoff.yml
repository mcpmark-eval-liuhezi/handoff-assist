name: Handoff Summary

on:
  workflow_dispatch:
    branches: [main]

jobs:
  generate-log:
    runs-on: ubuntu-latest
    steps:
      - name: Write handoff log
        run: |
          {
            echo "handoff-summary log"
            echo "repository: ${GITHUB_REPOSITORY}"
            echo "workflow: handoff.yml"
            echo "run: ${GITHUB_RUN_ID}"
            echo "triggered: ${GITHUB_REF}"
          } > handoff-summary.log
      - name: Upload handoff summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: handoff-summary
          path: handoff-summary.log
          if-no-files-found: error
